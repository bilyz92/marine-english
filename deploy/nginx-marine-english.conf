# nginx cho conghung.ce-tanker.vn → app ở 127.0.0.1:3100 (đổi tên miền 08/11/2026, bỏ marine-english.heytek.vn).
# ce-tanker.vn và www.ce-tanker.vn chuyển hẳn (301) về conghung.ce-tanker.vn.
# Chứng chỉ chung cho 3 tên (một lần, gia hạn tự động qua webroot):
#   sudo certbot certonly --webroot -w /var/www/certbot --cert-name ce-tanker.vn -d conghung.ce-tanker.vn -d ce-tanker.vn -d www.ce-tanker.vn

# Cổng 80: chỉ để Let's Encrypt gia hạn, còn lại chuyển sang HTTPS của tên chính.
server {
    listen 80;
    server_name conghung.ce-tanker.vn ce-tanker.vn www.ce-tanker.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://conghung.ce-tanker.vn$request_uri; }
}

# Tên phụ trên HTTPS: chuyển hẳn về tên chính, giữ nguyên đường dẫn.
server {
    listen 443 ssl;
    server_name ce-tanker.vn www.ce-tanker.vn;
    ssl_certificate /etc/letsencrypt/live/ce-tanker.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ce-tanker.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://conghung.ce-tanker.vn$request_uri;
}

server {
    listen 443 ssl;
    server_name conghung.ce-tanker.vn;
    ssl_certificate /etc/letsencrypt/live/ce-tanker.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ce-tanker.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè, không nối thêm: app tính giới hạn đăng nhập theo IP từ X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Chủ tải gói nội dung (zip/json/docx): giới hạn khớp app (16 MB, thân là bytes thô), chờ nhập tối đa 90 s.
    location = /api/quan-tri/content/import {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# Tên miền cũ marine-english.heytek.vn đã bỏ (08/11/2026): đóng kết nối, không để rơi vào trang mặc định của máy (trang khác).
# Chứng chỉ cũ giữ đến khi hết hạn chỉ để bắt tay TLS cho khối này; xóa DNS của tên cũ thì xóa luôn khối này và chứng chỉ.
server {
    listen 80;
    server_name marine-english.heytek.vn;
    return 444;
}
server {
    listen 443 ssl;
    server_name marine-english.heytek.vn;
    ssl_certificate /etc/letsencrypt/live/marine-english.heytek.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marine-english.heytek.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}
