# nginx cho marine-english.heytek.vn → app ở 127.0.0.1:3100. Chứng chỉ do certbot thêm vào (certbot --nginx -d marine-english.heytek.vn).
server {
    listen 80;
    server_name marine-english.heytek.vn;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè, không nối thêm: app tính giới hạn đăng nhập theo IP từ X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Chủ tải gói nội dung (zip/json/docx): giới hạn khớp app (16 MB, thân là bytes thô), chờ nhập tối đa 90 s.
    location = /api/quan-tri/content/import {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Chỉ có tác dụng trên khối HTTPS (certbot chép khối này sang cổng 443).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
